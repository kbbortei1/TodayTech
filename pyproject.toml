[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todaytech"
version = "0.1.0"
description = "Personal opportunity-radar agent: hackathons, scholarships, internships & more"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["opportunities", "hackathons", "scholarships", "telegram-bot", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # Telegram
    "python-telegram-bot[job-queue]>=21,<22",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    # LLM clients
    "google-generativeai>=0.8,<1",
    "groq>=0.11,<1",
    "httpx>=0.27,<1",
    # Data
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6,<7",
    # Scheduling
    "apscheduler>=3.10,<4",
    # Search & scraping
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    # Telegram channels
    "telethon>=1.36,<2",
    # Utilities
    "python-dotenv>=1.0,<2",
    "tenacity>=9,<10",
    "thefuzz>=0.22,<1",
    "python-docx>=1.1,<2",
    "rich>=13,<14",
    "click>=8,<9",
    "structlog>=24,<25",
    "robotexclusionrulesparser>=1.7,<2",
]

[project.optional-dependencies]
reddit = ["asyncpraw>=7.7,<8"]
lxml = ["lxml>=5,<6"]
postgres = ["asyncpg>=0.29,<1"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
    "pre-commit>=4,<5",
    "detect-secrets>=1.5,<2",
    "types-PyYAML>=6,<7",
    "types-beautifulsoup4>=4,<5",
    "types-python-docx>=1,<2",
]

[project.scripts]
todaytech = "todaytech.cli.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["todaytech"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
