name: Scheduled Opportunity Scan & Digest

# Allows users to self-host TodayTech scans entirely on GitHub Actions for free.
# Configure your secrets in your repo Settings -> Secrets and variables -> Actions:
# - GEMINI_API_KEY (or GROQ_API_KEY / OPENROUTER_API_KEY)
# - TAVILY_API_KEY (or BRAVE_SEARCH_API_KEY)
# - TELEGRAM_BOT_TOKEN (optional)
# - TELEGRAM_USER_ID (optional)
# - PROFILE_YAML (optional custom profile text)

on:
  schedule:
    # Runs at 08:00 UTC daily (adjust to your preference)
    - cron: "0 8 * * *"
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore opportunity database cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: data/
          key: todaytech-data-${{ github.run_id }}
          restore-keys: |
            todaytech-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run scan and send digest
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          TODAYTECH_DATA_DIR: ./data
        run: |
          mkdir -p data

          # Check if required secrets are configured in GitHub Actions
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice title=Skipping Cloud Scan::No LLM API keys found in GitHub Secrets. To enable daily automated scans on GitHub Actions, add GEMINI_API_KEY (and TAVILY_API_KEY) under Repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          # Prepare profile
          if [ -n "$PROFILE_YAML" ]; then
            echo "$PROFILE_YAML" > profile.yaml
          elif [ ! -f profile.yaml ]; then
            cp profile.example.yaml profile.yaml
          fi

          # Run opportunity scan
          todaytech scan

          # Send digest notification if Telegram is configured
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_USER_ID" ]; then
            todaytech digest --notify
          fi

      - name: Save updated database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todaytech-data
          path: data/
          retention-days: 14

