version: '3.8'

services:
  todaytech:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todaytech-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Local state & generated drafts
      - ./data:/app/data
      # User eligibility profile
      - ./profile.yaml:/app/profile.yaml:ro
      # Custom sources configuration
      - ./sources.yaml:/app/sources.yaml:ro
      - ./sources/packs:/app/sources/packs:ro
    environment:
      - TODAYTECH_DATA_DIR=/app/data
      - TODAYTECH_PROFILE=/app/profile.yaml
      - TODAYTECH_SOURCES=/app/sources.yaml
      - PYTHONUNBUFFERED=1
    command: ["bot", "run"]

  # Optional background scheduler runner (if running separate from bot)
